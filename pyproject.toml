[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sealand-oog-route-permit-assistant"
version = "2.1.0"
authors = [
  { name="Sealand Logistics Solution Engineering" },
]
description = "Deterministic Zero-LLM Retrieval-Augmented Logic (RAL) Route & Compliance Solver for OOG Heavy Cargo"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=3.4",
    "rapidfuzz>=3.12.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0"
]
